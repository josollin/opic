<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>원더스피크 OPIc 모의고사</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --blue:#0c70f2; --blue-d:#0957bd; --blue-l:#e8f1fe; --orange:#ffae6a; --orange-l:#fff3e8;
  --ink:#16202e; --sub:#5b6676; --line:#e3e8ef; --bg:#f5f7fb; --card:#fff; --red:#e5484d; --green:#1f9d63;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px}
.wrap{max-width:880px;margin:0 auto;padding:24px 18px 80px}
header.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header.top .in{max-width:880px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:12px}
.logo{font-weight:800;letter-spacing:-.3px;font-size:17px}
.logo b{color:var(--blue)} .logo span{color:var(--orange);font-weight:800}
.top .spacer{flex:1}
.timer{font-variant-numeric:tabular-nums;font-weight:700;background:var(--blue-l);color:var(--blue);padding:6px 12px;border-radius:999px;font-size:14px;display:none}
.timer.warn{background:#fdecec;color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;margin-bottom:18px}
h1{font-size:28px;letter-spacing:-.6px;margin:0 0 8px}
h2{font-size:21px;letter-spacing:-.4px;margin:0 0 6px}
h3{font-size:16px;margin:18px 0 8px}
p.lead{color:var(--sub);margin:0 0 20px;line-height:1.6}
.muted{color:var(--sub);font-size:14px;line-height:1.6}
.hero{background:linear-gradient(135deg,var(--blue) 0%,#3b8cf7 60%,#5aa0ff 100%);color:#fff;border:none;position:relative;overflow:hidden}
.hero h1{font-size:32px}
.hero p{color:#e6f0ff;line-height:1.65;margin:0}
.hero .blob{position:absolute;right:-50px;top:-60px;width:220px;height:220px;border-radius:50%;background:#fff;opacity:.12}
.hero .blob2{position:absolute;right:90px;bottom:-60px;width:120px;height:120px;border-radius:50%;background:#fff;opacity:.15}
.hero .tag{display:inline-block;background:rgba(255,255,255,.18);padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600;margin-bottom:14px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px;position:relative}
.steps div{background:rgba(255,255,255,.14);border-radius:12px;padding:12px;font-size:13px;line-height:1.45}
.steps b{display:block;font-size:12px;opacity:.8;margin-bottom:3px}
label.f{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
.inp{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-l)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1;min-width:200px}
.btn{border:none;border-radius:12px;padding:13px 22px;font-weight:700;font-size:15px;background:var(--blue);color:#fff;transition:.15s}
.btn:hover{background:var(--blue-d)}
.btn:disabled{background:#b8c4d4;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--bg)}
.btn.orange{background:var(--orange);color:#3b2410}
.btn.orange:hover{background:#ff9d4d}
.btn.sm{padding:8px 14px;font-size:13px;border-radius:10px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
.chk{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 15px;font-size:14px;user-select:none;cursor:pointer;transition:.12s}
.chip:hover{border-color:var(--blue)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.survey-part{border-top:1px dashed var(--line);padding-top:6px;margin-top:14px}
.survey-part:first-of-type{border-top:none}
.survey-part.sub{border-top:none;margin:-4px 0 0 18px;padding-left:14px;border-left:3px solid var(--blue-l)}
.survey-part.sub h3{font-size:14.5px;color:var(--sub)}
.counter{position:sticky;bottom:12px;background:var(--ink);color:#fff;border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:12px;margin-top:20px;font-size:14px}
.counter b{color:var(--orange)}
.counter .spacer{flex:1}
.levels{display:grid;gap:10px}
.lv{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;background:#fff;transition:.12s}
.lv:hover{border-color:var(--blue)}
.lv.on{border-color:var(--blue);background:var(--blue-l)}
.lv .n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:800;color:var(--blue)}
.lv.on .n{background:var(--blue);color:#fff}
.lv .t{font-size:14px;line-height:1.6;color:var(--ink)}
.mic-test{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--bg);border-radius:14px;padding:16px;margin-top:10px}
.meter{flex:1;min-width:140px;height:10px;background:#dfe5ee;border-radius:999px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),#7bd88f);transition:width .08s}
.ok{color:var(--green);font-weight:700;font-size:14px}
.err{color:var(--red);font-weight:600;font-size:14px}
.notice{background:var(--orange-l);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.6;color:#6b3d14;margin-top:14px}
.notice.blue{background:var(--blue-l);color:#0b3e86}

/* exam */
.progress{display:flex;gap:5px;margin:4px 0 18px}
.progress i{flex:1;height:6px;border-radius:999px;background:#dfe5ee}
.progress i.done{background:var(--blue)}
.progress i.cur{background:var(--orange)}
.exam{display:grid;grid-template-columns:240px 1fr;gap:22px;align-items:center}
.avatar{background:linear-gradient(160deg,var(--blue-l),#fff);border-radius:18px;padding:18px;text-align:center;border:1px solid var(--line)}
.avatar svg{width:100%;max-width:190px;height:auto}
.avatar .nm{font-weight:700;margin-top:6px}
.avatar .st{font-size:13px;color:var(--sub);margin-top:2px;min-height:18px}
.speaking .mouth{animation:talk .25s infinite alternate}
@keyframes talk{from{transform:scaleY(.4)}to{transform:scaleY(1.2)}}
.qbox .qn{font-size:14px;font-weight:700;color:var(--blue);margin-bottom:6px}
.qbox h2{font-size:24px}
.big-play{width:92px;height:92px;border-radius:50%;border:none;background:var(--blue);color:#fff;display:grid;place-items:center;margin:18px 0;box-shadow:0 10px 24px rgba(12,112,242,.3)}
.big-play:hover{background:var(--blue-d)}
.big-play:disabled{background:#b8c4d4;box-shadow:none}
.big-play svg{width:38px;height:38px}
.rec-panel{background:#fff5f5;border:1px solid #f6cfd0;border-radius:14px;padding:16px;margin-top:14px;display:none}
.rec-panel .top{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--red)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--red);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.rec-panel .el{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink)}
.rec-panel .meter{margin-top:12px}
.replay-bar{display:none;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.count{font-size:13px;color:var(--sub)}
.qtext-peek{margin-top:12px;font-size:14px;color:var(--sub);display:none;background:var(--bg);padding:12px;border-radius:10px;line-height:1.6}

/* results */
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.sum div{background:var(--bg);border-radius:12px;padding:12px}
.sum b{display:block;font-size:12px;color:var(--sub);font-weight:600;margin-bottom:3px}
.sum span{font-weight:800;font-size:17px}
.grade-card{background:linear-gradient(135deg,var(--ink),#2b3a52);color:#fff;border:none}
.grade{font-size:54px;font-weight:900;letter-spacing:-1px;color:var(--orange);line-height:1}
.grade-card ul{margin:6px 0 0;padding-left:18px;line-height:1.7;color:#dbe4f0;font-size:14px}
.grade-card h3{color:#fff}
.fb-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ans{border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px;background:#fff}
.ans .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--blue-l);color:var(--blue)}
.badge.o{background:var(--orange-l);color:#a2541a}
.ans .q{font-size:15px;line-height:1.6;margin:10px 0}
.ans audio{width:100%;margin:6px 0}
.ans textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;padding:10px;line-height:1.6;resize:vertical}
.ans .fb{background:var(--blue-l);border-radius:10px;padding:12px 14px;margin-top:10px;font-size:14px;line-height:1.65;display:none}
.corr{margin:6px 0 0;padding:0;list-style:none}
.corr li{margin:6px 0}
.corr del{color:var(--red)} .corr ins{color:var(--green);text-decoration:none;font-weight:700}
.fls{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.fl{font-size:12.5px;padding:5px 10px;border-radius:999px;background:var(--bg);color:var(--sub)}
.fl b{color:var(--ink);font-weight:700;margin-right:2px}
.fl.good{background:#e6f6ee;color:#16774a}.fl.mid{background:#fff4e5;color:#9a5a12}.fl.bad{background:#fdecec;color:#b42328}
.flu{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.flu>div{border-radius:14px;padding:14px;background:var(--bg)}
.flu>div.good{background:#e6f6ee}.flu>div.mid{background:#fff4e5}.flu>div.bad{background:#fdecec}
.flu small{display:block;font-size:12px;color:var(--sub);font-weight:600}
.flu strong{display:block;font-size:24px;margin:4px 0 2px;letter-spacing:-.5px}
.flu em{font-style:normal;font-size:12.5px;font-weight:700}
.flu .good em{color:#16774a}.flu .mid em{color:#9a5a12}.flu .bad em{color:#b42328}
@media(max-width:720px){.flu{grid-template-columns:1fr 1fr}}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,35,.55);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal{background:#fff;border-radius:18px;padding:24px;max-width:620px;width:100%;max-height:88vh;overflow:auto}
.modal textarea{width:100%;height:260px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px}
.bar{height:10px;background:var(--bg);border-radius:999px;overflow:hidden;margin:12px 0}
.bar i{display:block;height:100%;width:0;background:var(--blue);transition:width .2s}
.hidden{display:none!important}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:720px){
  .exam{grid-template-columns:1fr}
  .avatar{display:flex;align-items:center;gap:12px;text-align:left;padding:12px}
  .avatar svg{width:70px}
  .steps,.sum{grid-template-columns:1fr 1fr}
  .fb-grid{grid-template-columns:1fr}
  .card{padding:20px}
  h1,.hero h1{font-size:25px}
}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="logo"><b>원더스피크</b> <span>OPIc</span> 모의고사</div>
  <div class="spacer"></div>
  <div class="timer" id="timer">40:00</div>
</div></header>

<main class="wrap" id="app"></main>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>

<script>
/* =========================================================
   설정 — 설치 가이드(README.md)를 보고 채워 주세요
   ========================================================= */
const CONFIG = {
  // Google Apps Script 웹 앱 URL. 비워 두면 AI 피드백은 "프롬프트 복사" 방식, 제출은 ZIP 다운로드 방식으로 동작합니다.
  SCRIPT_URL: "https://script.google.com/macros/s/AKfycby46OHJQPPoWvWvcwVxbbXfjzdZ7yDFEPk5Z7__4_XBL0aXrrhFeST_hqrkYPo9ET8pkA/exec",
  // Apps Script에 ACCESS_CODE를 설정했다면 true로 바꾸세요. 학생이 시작 화면에서 수강생 코드를 입력합니다.
  ASK_CODE: true,
  TOTAL_MINUTES: 40,
  ACADEMY: "WonderSpeak",
  // 시험이 끝난 뒤 학생에게 보여 줄 범위
  //  "grade_only": AI 분석과 제출이 자동으로 진행되고, 학생은 예상 등급만 봐요. 상세 피드백은 선생님이 teacher.html에서 정리해 카톡으로 보내요.
  //  "full": 학생이 녹음·받아쓰기·AI 피드백을 모두 직접 봐요. (SCRIPT_URL이 비어 있으면 자동으로 이 방식이 돼요)
  STUDENT_VIEW: "grade_only"
};

/* =========================================================
   문제 은행
   d: 묘사 / r: 루틴·습관 / p: 과거 경험 / c: 비교·변화 / i: 이슈·의견
   ========================================================= */
const TOPICS = {
  home:{kr:"집",d:"You indicated in the survey that you live in a house or an apartment. Please describe your home to me. What does it look like? How many rooms does it have, and which room do you like the most?",r:"What do you usually do at home on weekdays and on weekends? Tell me about a typical day at home from beginning to end.",p:"Have you made any changes to your home since you moved in, such as buying new furniture or redecorating? Tell me about the changes in as much detail as possible.",c:"Compare the home you lived in as a child with the home you live in now. What are the similarities and differences?",i:"Housing is a big issue in many countries. What problems do people in your country face when they look for a place to live? What do you think should be done about it?"},
  neighborhood:{kr:"동네",d:"Please describe your neighborhood. What is it like, and what kinds of places and buildings are there?",r:"What do people usually do in your neighborhood? Where do you like to go in your neighborhood, and why?",p:"Tell me about a memorable experience you had in your neighborhood. What happened, who were you with, and why was it so memorable?",c:"How has your neighborhood changed over the years? Compare what it was like in the past with what it is like now.",i:"Many old neighborhoods are being redeveloped these days. What do people think about redevelopment, and what problems can it cause?"},
  movies:{kr:"영화 보기",d:"You indicated in the survey that you like to go to the movies. What kinds of movies do you like to watch? Who is your favorite actor or actress, and why do you like them?",r:"Tell me about what you usually do when you go to the movies. Who do you go with? What do you do before and after the movie?",p:"Tell me about the most memorable movie you have seen recently. What was it about, and why was it so memorable?",c:"How have movies changed compared to when you were younger? Think about the kinds of movies, the theaters, and how people watch movies.",i:"These days many people watch movies on streaming services instead of going to theaters. What do you think about this trend? How does it affect the movie industry?"},
  concert:{kr:"공연·콘서트 보기",d:"You indicated that you like to go to concerts or performances. What kinds of performances do you enjoy? Where do you usually go to see them?",r:"Tell me about what you typically do when you go to a concert. How do you get tickets, who do you go with, and what do you do afterwards?",p:"Tell me about the first concert or performance you ever went to. When was it, who did you go with, and how did you feel?",c:"Compare concerts in the past with concerts today. How have ticket prices, venues, or audiences changed?",i:"Ticket scalping is a big problem for popular concerts. Why does this happen, and what can be done to solve it?"},
  park:{kr:"공원 가기",d:"You indicated that you like to go to the park. Please describe a park you often go to. What does it look like, and what can people do there?",r:"What do you usually do when you go to the park? Who do you go with, and how often do you go?",p:"Tell me about a memorable experience you had at a park. What happened, and why do you still remember it?",c:"How have parks in your country changed over the years? Compare parks in the past and parks today.",i:"Some people say cities need more green spaces. Why are parks important for people living in cities, and what problems do parks face these days?"},
  beach:{kr:"해변·캠핑 가기",d:"You indicated that you like to go to the beach or go camping. Describe a beach or campsite you like. Where is it, and what is it like?",r:"What do you usually do when you go to the beach or go camping? What do you bring with you, and who do you go with?",p:"Tell me about a memorable trip to the beach or a camping trip. What happened from beginning to end?",c:"How has camping or going to the beach changed in your country compared to the past?",i:"Many beaches and campsites have problems with trash and pollution. What causes these problems, and how can we protect these places?"},
  cafe:{kr:"카페 가기",d:"You indicated that you like to go to cafes. Describe your favorite cafe. Where is it, what does it look like, and why do you like it?",r:"What do you usually do at a cafe? When do you go, who do you go with, and what do you usually order?",p:"Tell me about a memorable experience you had at a cafe. What happened, and why was it special?",c:"Cafes have changed a lot in recent years. Compare cafes in the past with cafes today.",i:"There are too many cafes in some areas these days. Why do you think there are so many cafes, and what problems can this cause?"},
  shopping:{kr:"쇼핑하기",d:"You indicated that you like to go shopping. Where do you like to go shopping? Describe the place in detail.",r:"Tell me about your shopping habits. What do you usually buy, how often do you shop, and who do you go with?",p:"Tell me about a memorable shopping experience. Maybe you found a great deal or had a problem with something you bought. What happened?",c:"How has shopping changed compared to when you were younger? Compare shopping in the past with shopping today.",i:"Online shopping has become very popular. What are the advantages and disadvantages of online shopping for consumers and for small businesses?"},
  tv:{kr:"TV·리얼리티쇼 시청",d:"You indicated that you like to watch TV. What kinds of TV programs do you enjoy the most? Tell me about your favorite program.",r:"When and where do you usually watch TV? Who do you watch with, and what do you do while you watch?",p:"Tell me about a TV program that you remember well. When did you watch it, and why was it so memorable?",c:"How have TV programs changed over the years? Compare the programs people watched in the past with the programs they watch today.",i:"Some people worry that reality shows give a false picture of real life. What do you think about this? What effect do these shows have on viewers?"},
  music:{kr:"음악 감상",d:"You indicated that you like to listen to music. What kinds of music do you like? Who are your favorite singers or musicians?",r:"When and where do you usually listen to music? How do you listen to it, and how does it make you feel?",p:"Tell me about how you first became interested in music. What kind of music did you listen to when you were young, and how has your taste changed?",c:"How has the way people listen to music changed over the years? Compare the past with today.",i:"Many musicians say streaming services don't pay them enough. What do you think about this issue? How does it affect the music industry?"},
  cooking:{kr:"요리하기",d:"You indicated that you like to cook. What kinds of food do you like to cook? Tell me about a dish you are good at making.",r:"Tell me about your cooking routine. When do you cook, who do you cook for, and how do you prepare?",p:"Tell me about a time when you cooked something memorable. Maybe it went very well or very badly. What happened?",c:"How have people's eating and cooking habits changed compared to the past?",i:"Many people eat fast food or delivery food instead of cooking at home these days. Why is this happening, and what problems can it cause?"},
  reading:{kr:"독서",d:"You indicated that you like to read. What kinds of books do you like to read? Who is your favorite author?",r:"When and where do you usually read? How often do you read, and how do you choose your books?",p:"Tell me about a book that left a strong impression on you. What was it about, and how did it affect you?",c:"How have people's reading habits changed compared to the past? Think about paper books, e-books, and audiobooks.",i:"Some people say that people don't read as much as they used to. Why do you think this is happening, and is it a problem?"},
  jogging:{kr:"조깅",d:"You indicated that you go jogging. Where do you usually jog? Describe the place and tell me why you like jogging there.",r:"Tell me about your jogging routine. When do you jog, how long do you jog for, and what do you do before and after?",p:"Tell me about how you first started jogging. Was there a memorable moment or a problem you had while jogging?",c:"How has the way people exercise changed compared to the past?",i:"More and more people are interested in health and fitness. Why do you think this is, and what are some problems related to this trend?"},
  walking:{kr:"걷기",d:"You indicated that you like to take walks. Where do you usually walk? Describe the place in detail.",r:"Tell me about your walking routine. When do you walk, who do you walk with, and what do you think about while walking?",p:"Tell me about a memorable walk you took. Where were you, and what happened?",c:"How have walking paths or walking habits in your country changed over the years?",i:"Many cities are trying to become more walkable. Why is this important, and what makes it difficult?"},
  gym:{kr:"헬스",d:"You indicated that you go to the gym. Describe the gym you go to. What does it look like, and what equipment does it have?",r:"Tell me about your workout routine at the gym. What exercises do you do, and how often do you go?",p:"Tell me about how you started going to the gym. Has anything memorable or unexpected ever happened at the gym?",c:"Compare gyms in the past with gyms today. How have they changed?",i:"Some people spend a lot of money on fitness, such as personal training and supplements. What do you think about this? Is it worth it?"},

const fill = (t, T) => t.replace(/\{act\}/g, T.act).replace(/\{ing\}/g, T.ing);
const arr = v => v==null ? [] : Array.isArray(v) ? v : [v];
function candidates(id, type){
  const T = TOPICS[id] || {};
  const own = arr(T[type]);
  const gen = (T.act && GEN[type]) ? GEN[type].map(t=>fill(t,T)) : [];
  return [...own, ...gen];
}
function rpCandidates(id, type){
  const T = TOPICS[id] || {};
  const own = RP[id] ? arr(RP[id][type]) : [];
  const gen = (T.act && GEN_RP[type]) ? GEN_RP[type].map(t=>fill(t,T)) : [];
  return [...own, ...gen];
}

/* ========================================================= 음성(TTS) */
let VOICE = null;
function loadVoices(){
  const vs = speechSynthesis.getVoices().filter(v=>/^en(-|_)/i.test(v.lang));
  const pref = ["Google US English","Samantha","Microsoft Aria","Microsoft Jenny","Ava","Allison","Natural"];
  VOICE = null;
  for(const p of pref){ const v = vs.find(v=>v.name.includes(p)); if(v){VOICE=v;break;} }
  if(!VOICE) VOICE = vs.find(v=>/en-US/i.test(v.lang)) || vs[0] || null;
  return vs;
}
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
let speakToken = 0;
function speak(text, onStart){
  return new Promise(resolve=>{
    if(!("speechSynthesis" in window)){ resolve(); return; }
    const my = ++speakToken;
    speechSynthesis.cancel();
    // 크롬은 긴 문장을 중간에 끊는 경우가 있어 문장 단위로 나눠 읽습니다
    const parts = text.match(/[^.!?]+[.!?]*/g) || [text];
    let i = 0;
    const next = () => {
      if(my!==speakToken){ resolve(); return; }
      if(i>=parts.length){ resolve(); return; }
      const sentence = parts[i++].trim();
      const u = new SpeechSynthesisUtterance(sentence);
      u.lang = "en-US"; u.rate = 0.93; if(VOICE) u.voice = VOICE;
      // 일부 브라우저에서 끝 신호가 오지 않는 경우를 대비한 안전장치
      let moved = false;
      const go = () => { if(moved) return; moved = true; clearTimeout(wd); next(); };
      const wd = setTimeout(go, 2500 + sentence.split(/\s+/).length * 600);
      u.onend = go; u.onerror = go;
      speechSynthesis.speak(u);
    };
    onStart && onStart();
    next();
  });
}
function stopSpeak(){ speakToken++; if("speechSynthesis" in window) speechSynthesis.cancel(); }

let stream=null, audioCtx=null, analyser=null, meterRAF=0;
async function getMic(){
  if(stream && stream.active) return stream;
  stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  return stream;
}
function startMeter(el){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended") audioCtx.resume();
    const src = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser(); analyser.fftSize = 512; src.connect(analyser);
    const data = new Uint8Array(analyser.fftSize);
    cancelAnimationFrame(meterRAF);
    const loop = () => {
      analyser.getByteTimeDomainData(data);
      let sum=0; for(const v of data){const x=(v-128)/128; sum+=x*x;}
      const rms = Math.sqrt(sum/data.length);
      el.style.width = Math.min(100, rms*400) + "%";
      if(R.active) R.frames.push([performance.now(), rms]);
      meterRAF = requestAnimationFrame(loop);
    };
    loop();
  }catch(e){}
}
function stopMeter(){ cancelAnimationFrame(meterRAF); }
function pickMime(){
  if(!window.MediaRecorder) return null;
  for(const m of ["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg;codecs=opus"]) if(MediaRecorder.isTypeSupported(m)) return m;
  return "";
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
const R = { mr:null, chunks:[], t0:0, final:"", interim:"", recognizing:false, active:false, frames:[], qEnd:null };

/* ---------- 유창성 분석: 녹음 중 소리 크기를 기록해 멈춤·침묵을 계산 ---------- */
function analyzeFrames(frames, qEnd){
  if(frames.length < 20) return null;
  const vals = frames.map(f=>f[1]).sort((a,b)=>a-b);
  const pct = p => vals[Math.floor(p*(vals.length-1))];
  const floor = pct(0.15), hi = pct(0.9);
  const th = Math.max(0.01, floor + (hi-floor)*0.25);   // 주변 소음에 맞춰 자동으로 기준을 잡아요
  let first=null, last=null;
  for(const [t,v] of frames) if(v>th){ if(first===null) first=t; last=t; }
  if(first===null) return {span:0, pauses:0, longPauses:0, maxPause:0, silencePct:100, latency:null};
  const pauses=[]; let run=null;
  for(const [t,v] of frames){
    if(t<first || t>last) continue;
    if(v<=th){ if(run===null) run=t; }
    else if(run!==null){ const d=t-run; if(d>=250) pauses.push(d); run=null; } // 0.25초 미만은 음절 사이 끊김이라 제외
  }
  const span = (last-first)/1000;
  const silent = pauses.reduce((s,d)=>s+d,0)/1000;
  return {
    span: Math.round(span*10)/10,
    longPauses: pauses.filter(d=>d>=1500).length,
    maxPause: Math.round(Math.max(0,...pauses)/100)/10,
    silencePct: span>0 ? Math.round(100*silent/span) : 0,
    latency: qEnd ? Math.max(0, Math.round((first-qEnd)/100)/10) : null
  };
}
const wordCount = t => (String(t||"").match(/[A-Za-z][A-Za-z'’-]*/g)||[]).length;
function fluency(a){
  if(!a) return null;
  const m = a.m || {};
  const words = wordCount(a.transcript);
  const wpm = (m.span>=5 && words) ? Math.round(words/(m.span/60)) : null;
  const perMin = m.span>=5 ? Math.round(10*(m.longPauses||0)/(m.span/60))/10 : null;
  return {words, wpm, longPauses:m.longPauses??null, perMin, silencePct:m.silencePct??null, maxPause:m.maxPause??null, latency:m.latency??null, span:m.span??null};
}
// 원더스피크 참고 기준 (공식 OPIc 기준이 아니라 연습용 눈금이에요)
const BANDS = {
  wpm: v => v==null?null : v<70?["느린 편","bad"] : v<100?["보통","mid"] : v<=170?["자연스러움","good"] : ["매우 빠름","mid"],
  perMin: v => v==null?null : v<=1?["적음","good"] : v<=3?["보통","mid"] : ["많음","bad"],
  silencePct: v => v==null?null : v<=20?["적음","good"] : v<=35?["보통","mid"] : ["많음","bad"],
  latency: v => v==null?null : v<=3?["빠름","good"] : v<=6?["보통","mid"] : ["늦음","bad"]
};

function startRecording(){
  R.chunks=[]; R.final=""; R.interim=""; R.t0=Date.now(); R.active=true; R.frames=[];
  const mime = pickMime();
  R.mr = new MediaRecorder(stream, mime ? {mimeType:mime} : undefined);
  R.mr.ondataavailable = e => { if(e.data && e.data.size) R.chunks.push(e.data); };
  R.mr.start(1000);
  if(SR){
    try{
      rec = new SR(); rec.lang="en-US"; rec.continuous=true; rec.interimResults=true;
      rec.onresult = e => {
        let interim="";
        for(let i=e.resultIndex;i<e.results.length;i++){
          const r=e.results[i];
          if(r.isFinal) R.final += r[0].transcript.trim()+" "; else interim += r[0].transcript;
        }
        R.interim = interim;
      };
      rec.onerror = () => {};
      rec.onend = () => { if(R.active){ try{ rec.start(); }catch(e){} } };
      rec.start();
    }catch(e){ rec=null; }
  }
}
function stopRecording(){
  return new Promise(resolve=>{
    R.active=false;
    const secs = (Date.now()-R.t0)/1000;
    const m = analyzeFrames(R.frames, R.qEnd);
    if(rec){ try{ rec.stop(); }catch(e){} }
    const done = () => {
      const type = (R.mr && R.mr.mimeType) || "audio/webm";
      const blob = new Blob(R.chunks,{type});
      // 음성인식 마지막 결과가 들어올 시간을 조금 줍니다
      setTimeout(()=>{
        const transcript = (R.final + (R.interim||"")).replace(/\s+/g," ").trim();
        resolve({blob, url:URL.createObjectURL(blob), mime:type, seconds:secs, transcript, m});
      }, 600);
    };
    if(R.mr && R.mr.state!=="inactive"){ R.mr.onstop = done; R.mr.stop(); } else done();
  });
}

/* ========================================================= 문항 구성 (매 응시마다 무작위) */
function q(type, text, topic){ return {type, text, topic, kr: topic ? TOPICS[topic]?.kr || "" : ""}; }
function effLevel(){ return Math.max(1, Math.min(6, (S.level||3) + S.adjust)); }
function takeText(list){
  const c = shuffle(list).filter(t=>!S.usedText.has(t));
  if(!c.length) return null;
  S.usedText.add(c[0]); return c[0];
}
// 같은 시험 안에서 같은 질문이 두 번 나오지 않게, 남은 질문이 없으면 비슷한 다른 유형으로 바꿔요
const FALLBACK = {d:["d","r","p","c"], r:["r","d","p","c"], p:["p","r","d","c"], c:["c","p","i","r"], i:["i","c","p","r"]};
function pickQ(id, type){
  for(const t of FALLBACK[type]){ const text = takeText(candidates(id,t)); if(text) return q(t, text, id); }
  return q(type, candidates(id,type)[0] || candidates(id,"d")[0], id);
}
const pickRP = (id, type) => q(type==="c"?"rc":type, takeText(rpCandidates(id,type)) || rpCandidates(id,type)[0], id);
const hasWork = () => S.survey.job!==null && S.survey.job<=2 && S.survey.hasJob===0;
const inClass = () => S.survey.student===0 || (S.survey.student===1 && S.survey.classPast!==null && S.survey.classPast!==3);
function surveyTopics(){
  const picks = [...S.survey.picks].filter(id=>TOPICS[id]);
  const pool = [...picks, S.survey.living>=3 ? "neighborhood" : "home", "neighborhood"];
  if(hasWork()) pool.push("work");
  if(inClass()) pool.push("school");
  return [...new Set(pool)];
}
const unexpectedTopics = () => Object.keys(TOPICS).filter(k=>TOPICS[k].u);
function freshTopic(list){ const c = shuffle(list).filter(t=>!S.used.has(t)); const t = c[0] || pick(list); S.used.add(t); return t; }
function combo(lv){
  if(lv<=2) return ["d","r","p"];
  if(lv<=4) return pick([["d","r","p"],["d","p","p"],["d","r","p"]]);
  return pick([["d","r","p"],["d","p","c"],["d","c","p"],["d","p","p"]]);
}
const makeSet = (id, lv) => combo(lv).map(t=>pickQ(id,t));
const INTROS = ["Let's start the interview now. Tell me a little bit about yourself.",
  "Let's begin the interview. Can you please introduce yourself?",
  "Thank you for joining me today. Before we start, tell me something about yourself."];
function buildFirstHalf(){
  S.used = new Set(); S.usedText = new Set();
  const lv = S.level;
  const home = S.survey.living>=3 ? "neighborhood" : "home";
  // 2~4번: 설문 주제 (집·동네가 자주 나와요)
  const t1 = Math.random()<0.4 ? (S.used.add(home), home) : freshTopic(surveyTopics());
  // 5~7번: 설문 주제 또는 돌발
  const t2 = Math.random()<0.5 ? freshTopic(surveyTopics()) : freshTopic(unexpectedTopics());
  S.questions = [q("intro", pick(INTROS), null), ...makeSet(t1, lv), ...makeSet(t2, lv)];
}
function buildSecondHalf(){
  const lv = effLevel();
  // 8~10번: 돌발
  const t3 = freshTopic(unexpectedTopics());
  const set3 = makeSet(t3, lv);
  // 11~13번: 롤플레이 (설문 주제 또는 돌발)
  const rpOk = id => RP[id] || TOPICS[id]?.act;
  const rpPool = Math.random()<0.6 ? surveyTopics().filter(rpOk) : unexpectedTopics().filter(rpOk);
  const tr = freshTopic(rpPool.length ? rpPool : Object.keys(RP));
  const set4 = (lv<=3 ? ["ask","a","c"] : ["a","b","c"]).map(t=>pickRP(tr,t));
  // 14~15번: 난이도에 따라
  const t5 = freshTopic(Math.random()<0.5 ? unexpectedTopics() : surveyTopics());
  const types = lv>=5 ? ["c","i"] : lv>=3 ? [pick(["d","r"]),"p"] : ["d","r"];
  const set5 = types.map(t=>pickQ(t5,t));
  S.questions = [...S.questions.slice(0,7), ...set3, ...set4, ...set5];
}

let timerInt=0;
function startTimer(){
  S.startAt = Date.now();
  const el = $("#timer"); el.style.display="inline-block";
  clearInterval(timerInt);
  timerInt = setInterval(()=>{
    const left = CONFIG.TOTAL_MINUTES*60 - (Date.now()-S.startAt)/1000;
    el.textContent = "남은 시간 " + fmt(left);
    el.classList.toggle("warn", left < 300);
    if(left<=0){ clearInterval(timerInt); timeUp(); }
  },500);
}
async function timeUp(){
  if(S.finished) return;
  stopSpeak();
  if(R.active){ const a = await stopRecording(); S.answers[S.idx] = a; stopMeter(); }
  finishExam(true);
}

    if(sv.student===0) return single("classNow", SURVEY.classNow, "2-1. 현재 어떤 강의를 듣고 있습니까?", true);

      ${single("student",SURVEY.student,"2. 현재 귀하는 학생이십니까?")}${followStudent()}

      ${SURVEY.groups.map((g,gi)=>`
        <div class="survey-part"><h3>${gi+4}. ${["귀하는 여가 활동으로 주로 무엇을 하십니까?","귀하의 취미나 관심사는 무엇입니까?","귀하는 주로 어떤 운동을 즐기십니까?","귀하는 어떤 휴가나 출장을 다녀온 경험이 있습니까?"][gi]} <span class="muted">(${g.min}개 이상)</span></h3>
        <div class="chk">${g.items.map(id=>`<span class="chip ${sv.picks.has(id)?"on":""}" data-p="${id}">${surveyLabel(id)}</span>`).join("")}</div></div>`).join("")}
      <div class="counter"><span>선택 <b id="cnt">0</b> / 12</span><span class="muted" id="cntMsg" style="color:#c9d3e0"></span><span class="spacer"></span>
        <button class="btn orange sm" id="next" disabled>다음 →</button></div>
    </section>`;
    app.querySelectorAll("[data-k]").forEach(el=>el.onclick=()=>{
      const k = el.dataset.k, v = +el.dataset.i;
      sv[k] = v;
      // 상위 답을 바꾸면 하위 답은 다시 고르게 해요
      if(k==="job"){ sv.hasJob=null; sv.jobYears=null; sv.manager=null; }
      if(k==="hasJob"){ sv.jobYears=null; sv.manager=null; }
      if(k==="student"){ sv.classNow=null; sv.classPast=null; }
      const y = window.scrollY; render(); window.scrollTo(0,y);
    });
    app.querySelectorAll("[data-p]").forEach(el=>el.onclick=()=>{

    replayWindow();
  };
  $("#play").onclick = play;
  $("#replay").onclick = () => { replayed=true; play(); };
  $("#now").onclick = beginRecord;
  $("#next").onclick = async () => {
    $("#next").disabled = true; $("#next").innerHTML = '<span class="spin"></span>저장 중';
    clearInterval(elInt); stopMeter();
    const a = await stopRecording();
    S.answers[n] = a;
    if(S.finished) return;
    S.idx++;
    if(S.idx===7) viewAdjust();
    else if(S.idx>=15) finishExam(false);
    else viewQuestion();
  };
  scrollTop();
}

/* ========================================================= 시험 종료 → 결과 */
function finishExam(timeout){
  if(S.finished) return;
  S.finished = true; S.endAt = Date.now();
  clearInterval(timerInt); $("#timer").style.display="none";
  stopSpeak(); stopMeter();
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  if(CONFIG.SCRIPT_URL && CONFIG.STUDENT_VIEW==="grade_only") viewProcessing(timeout);
  else {
    if(timeout) alertModal("시간이 끝났어요", "제한 시간 "+CONFIG.TOTAL_MINUTES+"분이 지나 시험이 종료됐어요. 답변한 문항까지 결과를 볼 수 있어요.");
    viewResult();
  }
}

function items(){
  return S.questions.map((Q,i)=>{
    const a = S.answers[i], f = fluency(a) || {};
    return {n:i+1, type:TYPE_KR[Q.type]||Q.type, topic:Q.kr, q:Q.text,
      transcript:(a?.transcript)||"", seconds:Math.round(a?.seconds||0), answered:!!a,
      wpm:f.wpm??null, longPauses:f.longPauses??null, silencePct:f.silencePct??null, latency:f.latency??null, maxPause:f.maxPause??null};
  }).filter(x=>x.answered);
}
function fluencySummary(){
  const fs = S.answers.filter(Boolean).map(fluency);
  const avg = k => { const v = fs.map(f=>f[k]).filter(x=>x!=null); return v.length ? Math.round(10*v.reduce((s,x)=>s+x,0)/v.length)/10 : null; };
  return {wpm: avg("wpm")==null?null:Math.round(avg("wpm")), perMin: avg("perMin"), silencePct: avg("silencePct")==null?null:Math.round(avg("silencePct")),
          latency: avg("latency"), longPauses: fs.reduce((s,f)=>s+(f.longPauses||0),0)};
}
function chip(label, val, unit, band){
  const b = band ? band : null;
  const cls = b ? b[1] : "";
  return `<span class="fl ${cls}"><b>${label}</b> ${val==null?"-":val+unit}${b?` · ${b[0]}`:""}</span>`;
}
function fluencyChips(a){
  const f = fluency(a); if(!f) return "";
  return chip("말 속도", f.wpm, " WPM", BANDS.wpm(f.wpm)) +
         chip("긴 멈춤", f.longPauses, "회", BANDS.perMin(f.perMin)) +
         chip("침묵", f.silencePct, "%", BANDS.silencePct(f.silencePct)) +
         chip("첫마디", f.latency, "초", BANDS.latency(f.latency));
}

/* ========================================================= AI 피드백 */
function buildPrompt(level, its){
  return `당신은 ACTFL OPIc 공인 평가 기준을 잘 아는 영어 말하기 평가자이자, 인지언어학 기반으로 "왜 그렇게 말하는지"를 설명해 주는 원더스피크(WonderSpeak) 선생님입니다.
아래는 한국인 성인 학습자가 OPIc 모의고사에서 한 답변을 음성 인식으로 받아쓴 것입니다. 받아쓰기 오류가 있을 수 있으니 명백한 인식 오류는 감점하지 말고, 발음은 평가할 수 없다는 점을 감안하세요.

자가평가 단계: ${level}단계 (1~6)

${its.map(it=>`[Q${it.n}] (${it.type}${it.topic?` · ${it.topic}`:""}) 답변 시간 ${it.seconds}초
유창성 지표: 말 속도 ${it.wpm??"-"} WPM / 1.5초 이상 멈춤 ${it.longPauses??"-"}회 (가장 긴 멈춤 ${it.maxPause??"-"}초) / 침묵 비율 ${it.silencePct??"-"}% / 첫마디까지 ${it.latency??"-"}초
질문: ${it.q}
답변: ${it.transcript || "(받아쓰기 없음)"}`).join("\n\n")}

평가 기준: 과제 수행(질문에 맞는 답, 묘사·서술·비교·문제 해결), 문장 구성(단문→복문→문단), 시제 정확성과 일관성, 어휘 다양성, 답변 길이와 구체성, 담화 연결(접속사·전환 표현), 유창성(위 지표 — 원어민 대화 속도는 대략 120~160 WPM, 잦은 긴 멈춤과 높은 침묵 비율은 문장을 머릿속으로 만들며 말한다는 신호).

{
  "estimated_grade": "NL|NM|NH|IL|IM1|IM2|IM3|IH|AL 중 하나",
  "grade_reason": "이 등급으로 본 이유 2~3문장",
  "strengths": ["강점 2~3개"],
  "weaknesses": ["약점 2~3개"],
  "tense_check": "시제 사용 점검 2~3문장 (과거 경험 문항에서 과거 시제를 유지했는지 등)",
  "fluency_comment": "유창성 지표 해석 2~3문장 (어떤 문항 유형에서 멈춤이 늘었는지, 받아쓰기에 보이는 반복·자기 수정 등)",

  "per_question": [
    {"n": 1, "comment": "한두 문장 코멘트", "corrections": [{"before": "틀린 부분", "after": "고친 문장", "why": "짧은 이유"}], "better_expression": "이 답변에 넣으면 좋을 자연스러운 영어 한두 문장"}
  ]
}
per_question에는 답변한 모든 문항을 넣고, corrections는 문항당 최대 2개까지만 쓰세요.`;
}
async function api(body){

  if(!j.ok) throw new Error(j.error||"서버 오류");
  return j;
}

      <div>
        <h3 style="margin-top:0">👍 강점</h3><ul>${li(f.strengths)}</ul>
        <h3>🔧 보완할 점</h3><ul>${li(f.weaknesses)}</ul>
      </div>
    </div>
    <h3>⏱ 시제 점검</h3><p style="color:#dbe4f0;line-height:1.65;font-size:14px;margin:0">${esc(f.tense_check||"")}</p>
    ${f.fluency_comment?`<h3>🎙️ 유창성</h3><p style="color:#dbe4f0;line-height:1.65;font-size:14px;margin:0">${esc(f.fluency_comment)}</p>`:""}
    <h3>🚀 다음 단계</h3><ul>${li(f.next_steps)}</ul>
  </section>`;
  (f.per_question||[]).forEach(p=>{
    const box = $("#fb"+(p.n-1)); if(!box) return;
    box.style.display="block";
    box.innerHTML = `<b>💬 피드백</b><div>${esc(p.comment||"")}</div>
      ${(p.corrections||[]).length?`<ul class="corr">${p.corrections.map(c=>`<li><del>${esc(c.before)}</del> → <ins>${esc(c.after)}</ins><br><span class="muted">${esc(c.why)}</span></li>`).join("")}</ul>`:""}
      ${p.better_expression?`<div style="margin-top:8px"><b>✍ 이렇게 말해 보세요</b><br><i>${esc(p.better_expression)}</i></div>`:""}`;
  });
  $("#fbTop").scrollIntoView({behavior:"smooth"});
}

/* ========================================================= 제출 */
function blobToBase64(blob){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]); r.onerror=rej; r.readAsDataURL(blob); });
}
const extOf = mime => mime.includes("mp4") ? "m4a" : mime.includes("ogg") ? "ogg" : "webm";
function meta(){
  return {name:S.name, contact:S.contact, level:S.level, adjust:S.adjust,
    survey:{job:SURVEY.job[S.survey.job], hasJob:SURVEY.hasJob[S.survey.hasJob]??null, student:SURVEY.student[S.survey.student],
      classes:(S.survey.student===0?SURVEY.classNow[S.survey.classNow]:SURVEY.classPast[S.survey.classPast])??null, living:SURVEY.living[S.survey.living],
      picks:[...S.survey.picks].map(surveyLabel)},
    aiError:S.aiError||null,
    startedAt:new Date(S.startAt).toISOString(), durationSec:Math.round((S.endAt-S.startAt)/1000), fluency:fluencySummary()};
}
// 제출: 폴더 만들기 → 녹음 업로드(실패 시 1회 재시도) → 마무리. 중간에 실패해도 다시 부르면 이어서 올려요.
async function doSubmit(step){
  const answered = S.answers.map((a,i)=>a?{a,i}:null).filter(Boolean);
  S.sub = S.sub || {folderId:null, done:new Set()};
  if(!S.sub.folderId){
    step("제출 폴더 만드는 중…", 3);
    const st = await api({action:"start", meta:meta()});
    S.sub.folderId = st.folderId;
  }
  for(let k=0;k<answered.length;k++){
    const {a,i} = answered[k];
    if(S.sub.done.has(i)) continue;
    step(`녹음 파일 보내는 중… (${k+1}/${answered.length})`, 5 + 85*(k/answered.length));
    const body = {action:"audio", folderId:S.sub.folderId, name:`Q${String(i+1).padStart(2,"0")}.${extOf(a.mime)}`, mime:a.mime.split(";")[0], data:await blobToBase64(a.blob)};
    try{ await api(body); } catch(e){ await new Promise(r=>setTimeout(r,1500)); await api(body); }
    S.sub.done.add(i);
  }
  step("리포트 정리하는 중…", 95);
  await api({action:"finish", folderId:S.sub.folderId, meta:meta(), items:items(), feedback:S.feedback||null});
  step("완료!", 100);
  return answered.length;
}
async function submitToTeacher(){
  if(!CONFIG.SCRIPT_URL){
    alertModal("제출 서버가 아직 연결되지 않았어요", "대신 <b>전체 다운로드 (ZIP)</b>을 눌러 파일을 저장한 뒤, 카카오톡 등으로 선생님께 보내 주세요.");
    return;
  }
  openModal(`<h2>선생님께 제출하는 중</h2><p class="muted" id="subMsg">준비 중…</p><div class="bar"><i id="subBar"></i></div><p class="muted">창을 닫지 말고 잠시만 기다려 주세요.</p>`);
  const step = (msg, pct) => { $("#subMsg").textContent = msg; $("#subBar").style.width = pct+"%"; };
  try{
    const n = await doSubmit(step);
    openModal(`<h2>✅ 제출 완료</h2><p class="lead">녹음 ${n}개와 받아쓰기${S.feedback?", AI 피드백":""}이 선생님께 전달됐어요. 수고했어요!</p><div class="actions"><button class="btn" onclick="closeModal()">확인</button></div>`);
    $("#subBtn").textContent = "✅ 제출 완료"; $("#subBtn").disabled = true;
  }catch(e){
    openModal(`<h2>제출하지 못했어요</h2><p class="lead">${esc(e.message)}</p><p class="muted">인터넷 연결을 확인하고 다시 시도하거나, ZIP으로 내려받아 선생님께 보내 주세요.</p><div class="actions"><button class="btn ghost" onclick="closeModal()">닫기</button></div>`);
  }
}

/* ========================================================= ZIP 다운로드 */
function reportText(){
  const m = meta(), f = S.feedback;
  let t = `${CONFIG.ACADEMY} OPIc 모의고사 결과\n이름: ${m.name}\n연락처/반: ${m.contact||"-"}\n응시일: ${new Date(S.startAt).toLocaleString("ko-KR")}\n자가평가: ${m.level}단계 / 재조정: ${{"-1":"쉽게","0":"비슷하게","1":"어렵게"}[m.adjust]}\n설문 선택: ${m.survey.picks.join(", ")}\n\n`;
  const fs = fluencySummary();
  t += `[유창성 지표] 평균 말 속도 ${fs.wpm??"-"} WPM · 긴 멈춤 ${fs.longPauses}회(분당 ${fs.perMin??"-"}회) · 침묵 ${fs.silencePct??"-"}% · 첫마디 ${fs.latency??"-"}초\n\n`;
  if(f) t += `[AI 예상 등급] ${f.estimated_grade}\n${f.grade_reason}\n\n강점: ${(f.strengths||[]).join(" / ")}\n보완: ${(f.weaknesses||[]).join(" / ")}\n시제: ${f.tense_check}\n${f.fluency_comment?`유창성: ${f.fluency_comment}\n`:""}다음 단계: ${(f.next_steps||[]).join(" / ")}\n\n`;
  items().forEach(it=>{
    t += `----------------------------------------\nQ${it.n} (${it.type}${it.topic?" · "+it.topic:""}) ${fmt(it.seconds)}\n지표: ${it.wpm??"-"} WPM · 긴 멈춤 ${it.longPauses??"-"}회 · 침묵 ${it.silencePct??"-"}% · 첫마디 ${it.latency??"-"}초\n질문: ${it.q}\n답변: ${it.transcript||"(없음)"}\n`;
    const p = f && (f.per_question||[]).find(x=>x.n===it.n);
    if(p){ t += `피드백: ${p.comment}\n`; (p.corrections||[]).forEach(c=>t+=`  - ${c.before} → ${c.after} (${c.why})\n`); if(p.better_expression) t+=`추천 표현: ${p.better_expression}\n`; }
    t += "\n";
  });
  return t;
}
async function downloadZip(){
  if(!window.JSZip){ alertModal("다운로드 준비 실패","인터넷 연결을 확인한 뒤 새로고침 없이 다시 눌러 주세요."); return; }
  const b = $("#zipBtn"); b.disabled=true; b.innerHTML='<span class="spin" style="border-color:#ccc;border-top-color:#333"></span>압축 중…';
  const zip = new JSZip();
  S.answers.forEach((a,i)=>{ if(a) zip.file(`Q${String(i+1).padStart(2,"0")}.${extOf(a.mime)}`, a.blob); });
  zip.file("결과_리포트.txt", reportText());
  const blob = await zip.generateAsync({type:"blob"});
  const url = URL.createObjectURL(blob);
  const d = new Date(S.startAt);
  const a = document.createElement("a");
  a.href = url; a.download = `OPIc모의고사_${S.name}_${d.getMonth()+1}월${d.getDate()}일.zip`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 30000);
  b.disabled=false; b.innerHTML="⬇ 전체 다운로드 (ZIP)";
}

/* ========================================================= 모달 */
function openModal(html){ $("#modal").innerHTML = html; $("#modalBg").style.display="flex"; }
function closeModal(){ $("#modalBg").style.display="none"; }
function alertModal(title, body){ openModal(`<h2>${title}</h2><p class="lead">${body}</p><div class="actions"><button class="btn" onclick="closeModal()">확인</button></div>`); }
function promptModal(text){
  openModal(`<h2>AI 피드백 프롬프트</h2>
    <p class="lead">아래 내용을 복사해서 Claude(claude.ai)에 붙여 넣으면 같은 형식의 피드백을 받을 수 있어요.</p>
    <textarea id="pt" readonly>${esc(text)}</textarea>
    <div class="actions"><button class="btn ghost" onclick="closeModal()">닫기</button><button class="btn" id="cp">복사하기</button></div>`);
  $("#cp").onclick = async () => {
    try{ await navigator.clipboard.writeText(text); $("#cp").textContent="✓ 복사됨"; }
    catch(e){ $("#pt").select(); document.execCommand("copy"); $("#cp").textContent="✓ 복사됨"; }
  };
}
