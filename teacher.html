<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>OPIc 모의고사 · 선생님 검토실</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--blue:#0c70f2;--blue-d:#0957bd;--blue-l:#e8f1fe;--orange:#ffae6a;--orange-l:#fff3e8;--ink:#16202e;--sub:#5b6676;--line:#e3e8ef;--bg:#f5f7fb;--red:#e5484d;--green:#1f9d63;--kakao:#fee500}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;font-size:15px}
button,input,select,textarea{font-family:inherit;font-size:14px}
button{cursor:pointer}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header .in{padding:12px 20px;display:flex;align-items:center;gap:12px}
.logo{font-weight:800;font-size:16px}.logo b{color:var(--blue)}.logo span{color:var(--orange)}
.spacer{flex:1}
.btn{border:none;border-radius:10px;padding:10px 16px;font-weight:700;background:var(--blue);color:#fff}
.btn:hover{background:var(--blue-d)}.btn:disabled{background:#b8c4d4;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.ghost:hover{background:var(--bg)}
.btn.kakao{background:var(--kakao);color:#3a1d1d}.btn.kakao:hover{background:#f5dc00}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.inp,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
.inp:focus,textarea:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-l)}
textarea{resize:vertical;line-height:1.6}
.layout{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 57px)}
aside{background:#fff;border-right:1px solid var(--line);padding:14px;position:sticky;top:57px;height:calc(100vh - 57px);overflow:auto}
aside .tools{display:flex;gap:6px;margin-bottom:10px}
.item{padding:11px 12px;border-radius:12px;cursor:pointer;margin-bottom:4px;border:1px solid transparent}
.item:hover{background:var(--bg)}
.item.on{background:var(--blue-l);border-color:#bcd6fb}
.item .r1{display:flex;align-items:center;gap:6px}
.item .nm{font-weight:700}
.item .r2{font-size:12.5px;color:var(--sub);margin-top:3px}
.pill{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--sub)}
.pill.sent{background:#e6f6ee;color:#16774a}.pill.todo{background:#fff4e5;color:#9a5a12}.pill.g{background:var(--ink);color:var(--orange)}
main{padding:22px 26px 120px;max-width:1000px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.4px}
h2{font-size:18px;margin:0 0 12px;letter-spacing:-.3px}
h3{font-size:14px;margin:16px 0 8px;color:var(--sub)}
.muted{color:var(--sub);font-size:13px;line-height:1.6}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--sub);margin-top:6px}
.meta b{color:var(--ink)}
.links a{font-size:13px;color:var(--blue);text-decoration:none;margin-right:12px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grade-box{background:linear-gradient(135deg,var(--ink),#2b3a52);color:#fff;border-radius:14px;padding:18px}
.grade-box .g{font-size:44px;font-weight:900;color:var(--orange);line-height:1.1}
.grade-box small{color:#9fb0c8}
.rub{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;padding:10px 0;border-top:1px dashed var(--line)}
.rub:first-of-type{border-top:none}
.rub .nm{font-weight:700;font-size:14px}
.rub .hint{font-size:12px;color:var(--sub);margin-top:4px;line-height:1.5}
.scores{display:flex;gap:6px}
.scores button{width:38px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:700}
.scores button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.flu{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.flu>div{background:var(--bg);border-radius:12px;padding:12px}
.flu small{font-size:12px;color:var(--sub);font-weight:600;display:block}
.flu strong{font-size:20px}
.pick{display:flex;gap:10px;align-items:flex-start;margin:6px 0}
.pick input[type=checkbox]{width:18px;height:18px;margin-top:9px;flex:none;accent-color:var(--blue)}
.pick .inp,.pick textarea{padding:8px 10px}
.pick.off .inp,.pick.off textarea{opacity:.45}
.q{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;background:#fff}
.q .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--blue-l);color:var(--blue)}
.badge.o{background:var(--orange-l);color:#a2541a}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.chip{font-size:12px;padding:4px 9px;border-radius:999px;background:var(--bg);color:var(--sub)}
.chip b{color:var(--ink)}
.qt{font-size:14px;line-height:1.6;margin:8px 0;color:var(--sub)}
.ai{background:var(--blue-l);border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.6;margin:8px 0}
.corr{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:1}
.corr .why{grid-column:1/-1}
.corr .before{color:#b42328}.corr .after{color:#16774a;font-weight:600}
audio{width:100%;margin:6px 0}
.compose{position:relative}
.compose textarea{min-height:420px;font-size:14px;background:#fffef5}
.phone{background:#b2c7da;border-radius:18px;padding:16px}
.bubble{background:#fff;border-radius:4px 14px 14px 14px;padding:12px 14px;white-space:pre-wrap;font-size:13.5px;line-height:1.55;max-height:520px;overflow:auto}
/* ---------- 성적표 카드 (이미지로 저장되는 부분) ---------- */
#cardStage{position:fixed;left:-10000px;top:0}
.rc{width:720px;background:#f5f7fb;font-family:Pretendard,sans-serif;color:#16202e;padding:0 0 26px}
.rc-hd{background:linear-gradient(135deg,#0c70f2,#3b8cf7 65%,#5aa0ff);color:#fff;padding:30px 36px 74px;position:relative;overflow:hidden}
.rc-hd .blob{position:absolute;right:-60px;top:-80px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.12)}
.rc-hd .blob2{position:absolute;right:120px;bottom:-70px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.14)}
.rc-hd .brand{font-weight:800;font-size:17px;letter-spacing:-.2px;position:relative}
.rc-hd .brand span{color:#cfe3ff}
.rc-hd .ttl{font-size:15px;opacity:.9;margin-top:18px;position:relative;font-weight:600}
.rc-hd .nm{font-size:38px;font-weight:800;letter-spacing:-1px;margin-top:4px;position:relative}
.rc-hd .sub{font-size:14px;opacity:.85;margin-top:6px;position:relative}
.rc-body{padding:0 26px;margin-top:-50px;position:relative}
.rc-box{background:#fff;border-radius:20px;padding:22px 24px;margin-bottom:14px;box-shadow:0 4px 14px rgba(22,32,46,.06)}
.rc-box h4{margin:0 0 12px;font-size:15px;letter-spacing:-.2px}
.rc-grade{display:flex;align-items:center;gap:22px;background:#16202e;color:#fff}
.rc-grade .g{font-size:76px;font-weight:900;color:#ffae6a;letter-spacing:-2px;line-height:1}
.rc-grade small{color:#9fb0c8;font-size:13px;font-weight:600}
.ladder{display:flex;gap:4px;margin-top:10px}
.ladder i{font-style:normal;font-size:11.5px;font-weight:700;padding:5px 0;width:44px;text-align:center;border-radius:7px;background:#2b3a52;color:#7d8da6}
.ladder i.on{background:#ffae6a;color:#3b2410}
.sc-row{display:grid;grid-template-columns:120px 1fr 40px;align-items:center;gap:12px;margin:9px 0}
.sc-row .lb{font-weight:700;font-size:14.5px}
.sc-bar{display:flex;gap:5px}
.sc-bar i{flex:1;height:12px;border-radius:999px;background:#e3e8ef}
.sc-bar i.on{background:#0c70f2}
.sc-row .v{font-weight:800;font-size:17px;text-align:right;color:#0c70f2}
.rc-flu{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rc-flu div{background:#f5f7fb;border-radius:14px;padding:12px 10px;text-align:center}
.rc-flu div.good{background:#e6f6ee}.rc-flu div.mid{background:#fff4e5}.rc-flu div.bad{background:#fdecec}
.rc-flu small{display:block;font-size:12px;color:#5b6676;font-weight:600}
.rc-flu b{display:block;font-size:22px;margin:3px 0 1px}
.rc-flu em{font-style:normal;font-size:12px;font-weight:700}
.rc-flu .good em{color:#16774a}.rc-flu .mid em{color:#9a5a12}.rc-flu .bad em{color:#b42328}
.rc-two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rc-two .rc-box{margin-bottom:0}
.rc ul{margin:0;padding-left:18px;font-size:14px;line-height:1.65}
.rc ul li{margin-bottom:4px}
.rc-corr{border-left:3px solid #e3e8ef;padding:2px 0 2px 12px;margin:10px 0;font-size:14px;line-height:1.55}
.rc-corr .cq{font-size:11.5px;font-weight:800;color:#0c70f2;margin-bottom:2px}
.rc-corr del{color:#c0392b}
.rc-corr .af{color:#16774a;font-weight:700}
.rc-corr .why{color:#5b6676;font-size:12.5px}
.rc-tense{background:#e8f1fe;border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.65;color:#0b3e86;margin-top:12px}
.rc-memo{background:#fff3e8;border-radius:20px;padding:20px 24px;margin-bottom:14px;font-size:15px;line-height:1.7;color:#4a2a10}
.rc-memo b{display:block;font-size:13px;color:#a2541a;margin-bottom:6px}
.rc ol{margin:0;padding-left:20px;font-size:14px;line-height:1.65}
.rc-ft{text-align:center;font-size:12.5px;color:#7d8796;margin-top:18px}
.rc-ft b{color:#0c70f2}
.rc-ft img{height:24px;max-width:150px;object-fit:contain;display:block;margin:0 auto 8px}
.preview-img{width:100%;border-radius:14px;border:1px solid var(--line);display:block}
.limit{font-size:12px;color:#9a5a12;background:#fff4e5;border-radius:8px;padding:3px 8px;margin-left:6px;font-weight:600}
.sticky-bar{position:fixed;bottom:0;left:300px;right:0;background:#fff;border-top:1px solid var(--line);padding:10px 26px;display:flex;gap:8px;align-items:center;z-index:4}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:30}
.toast.on{opacity:1}
.center{max-width:420px;margin:12vh auto;text-align:center}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(0,0,0,.15);border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{color:var(--sub);text-align:center;padding:60px 0}
@media(max-width:900px){
  .layout{grid-template-columns:1fr}
  aside{position:static;height:auto;max-height:260px;border-right:none;border-bottom:1px solid var(--line)}
  .grid2,.flu{grid-template-columns:1fr 1fr}
  .sticky-bar{left:0}
  main{padding:16px 14px 120px}
}
</style>
</head>
<body>
<header><div class="in">
  <div class="logo"><b>Wonder</b>Speak <span>OPIc</span> · 선생님 검토실</div>
  <div class="spacer"></div>
  <button class="btn ghost sm hidden" id="logout" style="display:none">로그아웃</button>
</div></header>
<div id="root"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   설정 — index.html과 같은 SCRIPT_URL을 넣어 주세요
   ========================================================= */
const CONFIG = {
  SCRIPT_URL: "",
  DEFAULT_SIGN: "원더스피크",   // 성적표 맨 아래 서명 기본값
  LOGO_URL: "logo.png"          // 성적표 하단 로고. teacher.html과 같은 폴더에 logo.png를 올려 주세요 (없으면 글자로 표시)
};
// 로고 파일이 있는지 미리 확인해 두어요
let LOGO_OK = false;
(() => { const im = new Image(); im.onload = () => { LOGO_OK = true; }; im.src = CONFIG.LOGO_URL; })();

const RUBRIC = [
  ["발음","개별 소리(r/l, f/p, th, 모음 길이)와 단어 강세","1 자주 못 알아들음 · 3 가끔 다시 들어야 함 · 5 거의 오해 없음"],
  ["억양·리듬","내용어 강세, 기능어 약화, 문장 끝 억양 (한국어식 평평한 억양 여부)","1 단어를 하나씩 읽는 느낌 · 3 문장 단위 리듬 일부 · 5 자연스러운 강약과 억양"],
  ["유창성","속도, 멈춤 위치(문장 중간 vs 사이), 반복·자기 수정","1 단어마다 끊김 · 3 문장 중간에 가끔 멈춤 · 5 생각 단위로 매끄럽게"],
  ["자신감·전달력","목소리 크기와 에너지, 감정 표현, 망설임 소리","1 작고 망설임 · 3 무난함 · 5 대화하듯 생동감 있게"]
];
const GRADES = ["NL","NM","NH","IL","IM1","IM2","IM3","IH","AL"];

const $ = s => document.querySelector(s);
const root = $("#root");
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = { get(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }, del(k){ try{ localStorage.removeItem(k); }catch(e){} } };
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),1800); }

let TCODE = store.get("opic_tcode","");
let LIST = [], CUR = null, FILTER = "todo", AUDIO = {};

async function api(body){
  const res = await fetch(CONFIG.SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...body,tcode:TCODE})});
  const j = await res.json();
  if(!j.ok) throw new Error(j.error||"서버 오류");
  return j;
}

/* ========================================================= 로그인 */
function viewLogin(err){
  $("#logout").style.display="none";
  root.innerHTML = `<div class="center card">
    <h1>선생님 검토실</h1>
    <p class="muted">학생들이 제출한 모의고사를 확인하고, 카톡으로 보낼 피드백을 정리하는 곳이에요.</p>
    ${CONFIG.SCRIPT_URL?"":`<p class="muted" style="color:var(--red)">teacher.html의 CONFIG.SCRIPT_URL을 먼저 채워 주세요.</p>`}
    <input class="inp" id="tc" type="password" placeholder="선생님 코드 (TEACHER_CODE)" style="margin:14px 0 10px">
    <button class="btn" id="go" style="width:100%">들어가기</button>
    ${err?`<p class="muted" style="color:var(--red);margin-top:10px">${esc(err)}</p>`:""}
  </div>`;
  const go = async () => {
    TCODE = $("#tc").value.trim(); if(!TCODE) return;
    $("#go").disabled=true; $("#go").innerHTML='<span class="spin"></span>확인 중';
    try{ await loadList(); store.set("opic_tcode",TCODE); viewMain(); }
    catch(e){ viewLogin(e.message); }
  };
  $("#go").onclick = go; $("#tc").onkeydown = e => { if(e.key==="Enter") go(); };
}
async function loadList(){ const j = await api({action:"t_list"}); LIST = j.rows; }

/* ========================================================= 목록 */
function viewMain(){
  $("#logout").style.display="";
  $("#logout").onclick = () => { store.del("opic_tcode"); TCODE=""; viewLogin(); };
  root.innerHTML = `<div class="layout">
    <aside>
      <div class="tools">
        <input class="inp" id="q" placeholder="이름 검색">
        <button class="btn ghost sm" id="rf" title="새로고침">↻</button>
      </div>
      <div class="tools">
        <button class="btn sm ${FILTER==="todo"?"":"ghost"}" data-f="todo">미발송</button>
        <button class="btn sm ${FILTER==="all"?"":"ghost"}" data-f="all">전체</button>
      </div>
      <div id="list"></div>
    </aside>
    <main id="detail"><div class="empty">왼쪽에서 학생을 골라 주세요.</div></main>
  </div>`;
  $("#q").oninput = renderList;
  $("#rf").onclick = async () => { $("#rf").innerHTML='<span class="spin"></span>'; try{ await loadList(); }catch(e){ toast(e.message); } $("#rf").textContent="↻"; renderList(); };
  root.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{ FILTER=b.dataset.f; root.querySelectorAll("[data-f]").forEach(x=>x.classList.toggle("ghost",x!==b)); renderList(); });
  renderList();
}
function renderList(){
  const q = ($("#q")?.value||"").trim();
  const rows = LIST.filter(r=>(FILTER==="all"||!r.sent) && (!q || r.name.includes(q) || (r.contact||"").includes(q)));
  $("#list").innerHTML = rows.length ? rows.map(r=>`
    <div class="item ${CUR&&CUR.id===r.id?"on":""}" data-id="${esc(r.id)}">
      <div class="r1"><span class="nm">${esc(r.name)}</span><span class="spacer"></span>
        ${r.tgrade||r.ai?`<span class="pill g">${esc(r.tgrade||r.ai)}</span>`:""}
        <span class="pill ${r.sent?"sent":"todo"}">${r.sent?"발송완료":"미발송"}</span></div>
      <div class="r2">${esc(r.time)} · ${esc(r.level)} · ${esc(r.answered)}${r.contact?` · ${esc(r.contact)}`:""}</div>
    </div>`).join("") : `<div class="empty" style="padding:30px 0">${FILTER==="todo"?"미발송 제출이 없어요 🎉":"제출이 없어요"}</div>`;
  root.querySelectorAll(".item").forEach(el=>el.onclick=()=>openSubmission(el.dataset.id));
}

/* ========================================================= 상세 */
async function openSubmission(id){
  if(CUR && CUR.dirty && !await confirmBox("저장하지 않은 내용이 있어요. 다른 학생으로 넘어갈까요?")) return;
  $("#detail").innerHTML = `<div class="empty"><span class="spin"></span>불러오는 중…</div>`;
  try{
    const j = await api({action:"t_get", id});
    const d = j.data, fb = d.feedback, sh = j.sheet || {};
    const t = d.teacher || {};
    CUR = {
      id, data:d, files:j.files, sheet:sh, dirty:false,
      grade: t.grade || sh.tgrade || (fb&&fb.estimated_grade) || "",
      scores: t.scores || (sh.scores||[]).map(x=>x?Number(x):0),
      autoFlu: false,
      memo: t.memo ?? sh.memo ?? "",
      sign: store.get("opic_sign", CONFIG.DEFAULT_SIGN),
      lists: t.lists || listsFromFeedback(fb),
      qmemo: t.qmemo || {},
      message: sh.message || "",
      sent: !!sh.sent
    };
    // 채점이 비어 있으면 유창성은 자동 지표로 먼저 채워 둬요 (선생님이 바꿀 수 있어요)
    if(!CUR.scores.some(Boolean)){ const f = suggestFluency(d.meta?.fluency); if(f){ CUR.scores[2] = f; CUR.autoFlu = true; } }
    renderDetail(); renderList();
  }catch(e){ $("#detail").innerHTML = `<div class="empty">불러오지 못했어요: ${esc(e.message)}</div>`; }
}
function suggestFluency(fl){
  if(!fl || fl.wpm==null) return 0;
  let s = fl.wpm<60?1 : fl.wpm<80?2 : fl.wpm<100?3 : fl.wpm<130?4 : 5;
  if(fl.perMin!=null && fl.perMin>3) s--;
  if(fl.silencePct!=null && fl.silencePct>40) s--;
  return Math.max(1, Math.min(5, s));
}
function listsFromFeedback(fb){
  fb = fb || {};
  const corr = [];
  (fb.per_question||[]).forEach(p=>(p.corrections||[]).forEach((c,k)=>corr.push({n:p.n, before:c.before||"", after:c.after||"", why:c.why||"", on:k===0})));
  // 기본: 문항당 첫 교정만 켜고 최대 3개
  let cnt=0; corr.forEach(c=>{ if(c.on){ cnt++; if(cnt>3) c.on=false; } });
  const mk = (arr,max) => (arr||[]).map((x,i)=>({text:x,on:i<max}));
  return {
    strengths: mk(fb.strengths,2), weaknesses: mk(fb.weaknesses,2), next: mk(fb.next_steps,3),
    tense: {text:fb.tense_check||"", on:!!fb.tense_check}, fluency: {text:fb.fluency_comment||"", on:false},
    better: (fb.per_question||[]).filter(p=>p.better_expression).map(p=>({n:p.n, text:p.better_expression, on:false})),
    corr
  };
}

function keepScroll(fn){ const y = window.scrollY; fn(); window.scrollTo(0,y); }

async function playAudio(idx, fid){
  const box = $("#au"+idx);
  if(AUDIO[fid]){ box.innerHTML = `<audio controls autoplay src="${AUDIO[fid]}"></audio>`; return; }
  box.innerHTML = `<span class="muted"><span class="spin"></span>녹음 불러오는 중…</span>`;
  try{
    const j = await api({action:"t_audio", fileId:fid});
    const bin = atob(j.data), arr = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
    AUDIO[fid] = URL.createObjectURL(new Blob([arr],{type:j.mime||"audio/webm"}));
    box.innerHTML = `<audio controls autoplay src="${AUDIO[fid]}"></audio>`;
  }catch(e){ box.innerHTML = `<span class="muted" style="color:var(--red)">불러오지 못했어요: ${esc(e.message)}</span>`; }
}

  const C = CUR;
  if(!await confirmBox("고친 받아쓰기로 AI 분석을 다시 할까요? 지금 골라 둔 총평·교정 선택은 새 분석 결과로 바뀌어요. (선생님 점수·한마디·문항 메모는 유지돼요)")) return;

      </div>
      ${C.scores.some(Boolean)?`<div class="rc-box"><h4>🎙 말하기 평가</h4>
        ${RUBRIC.map((r,i)=>`<div class="sc-row"><div class="lb">${r[0]}</div><div class="sc-bar">${[1,2,3,4,5].map(k=>`<i class="${k<=(C.scores[i]||0)?"on":""}"></i>`).join("")}</div><div class="v">${C.scores[i]||"-"}</div></div>`).join("")}
      </div>`:""}
      ${fl.wpm!=null||fl.longPauses!=null?`<div class="rc-box"><h4>⏱ 말하기 흐름</h4><div class="rc-flu">
        ${tile("말 속도",fl.wpm," WPM",BANDS.wpm(fl.wpm))}${tile("긴 멈춤",fl.longPauses,"회",BANDS.perMin(fl.perMin))}${tile("침묵 비율",fl.silencePct,"%",BANDS.silencePct(fl.silencePct))}${tile("첫마디까지",fl.latency,"초",BANDS.latency(fl.latency))}
      </div></div>`:""}
      ${s.length||w.length?`<div class="rc-two" style="margin-bottom:14px">
        <div class="rc-box"><h4>👍 잘한 점</h4><ul>${s.map(x=>`<li>${esc(x.text.trim())}</li>`).join("")||"<li>-</li>"}</ul></div>
        <div class="rc-box"><h4>🔧 보완할 점</h4><ul>${w.map(x=>`<li>${esc(x.text.trim())}</li>`).join("")||"<li>-</li>"}</ul></div>
      </div>`:""}
      ${corr.length||tense?`<div class="rc-box"><h4>✏️ 이렇게 고쳐 보세요</h4>
        ${corr.map(c=>`<div class="rc-corr"><div class="cq">Q${c.n}</div><del>${esc(c.before.trim())}</del><div class="af">→ ${esc(c.after.trim())}</div>${c.why.trim()?`<div class="why">${esc(c.why.trim())}</div>`:""}</div>`).join("")}
        ${tense?`<div class="rc-tense"><b>시제 포인트</b><br>${esc(L.tense.text.trim())}</div>`:""}
      </div>`:""}
      ${C.memo.trim()?`<div class="rc-memo"><b>🗣 선생님 한마디</b>${esc(C.memo.trim()).replace(/\n/g,"<br>")}</div>`:""}
      ${n.length?`<div class="rc-box"><h4>📚 다음 연습</h4><ol>${n.map(x=>`<li>${esc(x.text.trim())}</li>`).join("")}</ol></div>`:""}
      <div class="rc-ft">${LOGO_OK?`<img src="${esc(CONFIG.LOGO_URL)}" alt="WonderSpeak">${esc(C.sign.trim()||"")}`:`<b>WonderSpeak</b> · ${esc(C.sign.trim()||"원더스피크")}`}</div>
    </div>
  </div>`;
}
async function makeCard(){
  const C = CUR, btn = $("#build");
  if(!window.html2canvas){ toast("이미지 도구를 불러오지 못했어요. 새로고침해 주세요"); return; }
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>만드는 중';
  try{
    $("#cardStage").innerHTML = cardHTML();
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    await Promise.all([...$("#rcCard").querySelectorAll("img")].map(im => im.decode ? im.decode().catch(()=>{}) : null));
    const canvas = await html2canvas($("#rcCard"), {scale:1.5, backgroundColor:"#f5f7fb", useCORS:true, logging:false});
    C.png = await new Promise(r=>canvas.toBlob(r,"image/png"));
    if(C.pngUrl) URL.revokeObjectURL(C.pngUrl);
    C.pngUrl = URL.createObjectURL(C.png);
    $("#pvWrap").innerHTML = `<img class="preview-img" src="${C.pngUrl}" alt="성적표 미리보기"><p class="muted" style="margin:6px 0 0">고른 항목을 바꿨다면 다시 만들어 주세요</p>`;
    $("#cardStage").innerHTML = "";
  }catch(e){ toast("성적표를 만들지 못했어요: "+e.message); }
  btn.disabled = false; btn.textContent = "성적표 다시 만들기";
}
async function copyImage(){
  const C = CUR;
  if(!C.png){ toast("먼저 [성적표 만들기]를 눌러 주세요"); return; }
  try{
    await navigator.clipboard.write([new ClipboardItem({"image/png": C.png})]);
    toast("이미지를 복사했어요! 카톡 채팅방에 Ctrl+V");
  }catch(e){ toast("이 브라우저는 이미지 복사가 안 돼요. PNG 저장을 써 주세요"); }
}
function downloadPng(){
  const C = CUR;
  if(!C.png){ toast("먼저 [성적표 만들기]를 눌러 주세요"); return; }
  const m = C.data.meta||{}, dt = m.startedAt ? new Date(m.startedAt) : new Date();
  const a = document.createElement("a");
  a.href = C.pngUrl; a.download = `성적표_${m.name||""}_${dt.getMonth()+1}월${dt.getDate()}일.png`;
  document.body.appendChild(a); a.click(); a.remove();
}
async function copyMsg(){
  const t = $("#msg").value;
  try{ await navigator.clipboard.writeText(t); }
  catch(e){ $("#msg").select(); document.execCommand("copy"); }
  toast("인사말을 복사했어요");
}
function blobToB64(blob){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]); r.onerror=rej; r.readAsDataURL(blob); }); }

/* ========================================================= 저장 */
async function save(silent, withPng){
  const C = CUR;
  const reportPng = (withPng && C.png) ? await blobToB64(C.png) : undefined;
  $("#saveState").innerHTML = '<span class="spin"></span>저장 중';
  try{
    await api({action:"t_save", id:C.id,
      teacher:{grade:C.grade, scores:C.scores, memo:C.memo, lists:C.lists, qmemo:C.qmemo, updatedAt:new Date().toISOString()},
      items: C.trEdited ? C.data.items : undefined,
      feedback: C.data.feedback,
      message: C.message, sent: C.sent, reportPng});
    C.dirty = false; C.trEdited = false;
    $("#saveState").textContent = C.sent ? "✅ 발송 완료로 표시됨" : "저장됨";
    const r = LIST.find(x=>x.id===C.id); if(r){ r.tgrade = C.grade; r.ai = C.data.feedback?.estimated_grade || r.ai; }
    if(!silent) toast("저장했어요");
  }catch(e){ $("#saveState").textContent = "저장 실패"; toast("저장 실패: "+e.message); throw e; }
}

/* ========================================================= 확인 창 (브라우저 confirm 대신) */
function confirmBox(msg){
  return new Promise(res=>{
    const bg = document.createElement("div");
    bg.style.cssText = "position:fixed;inset:0;background:rgba(10,20,35,.5);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px";
    bg.innerHTML = `<div class="card" style="max-width:420px;margin:0"><p style="line-height:1.6;margin:0 0 16px">${esc(msg)}</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn ghost" data-r="0">취소</button><button class="btn" data-r="1">확인</button></div></div>`;
    document.body.appendChild(bg);
    bg.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{ bg.remove(); res(b.dataset.r==="1"); });
  });
}
window.addEventListener("beforeunload", e => { if(CUR && CUR.dirty){ e.preventDefault(); e.returnValue=""; } });

/* ========================================================= 시작 */
(async () => {
  if(TCODE && CONFIG.SCRIPT_URL){
    root.innerHTML = `<div class="empty"><span class="spin"></span>불러오는 중…</div>`;
    try{ await loadList(); viewMain(); } catch(e){ viewLogin(e.message); }
  } else viewLogin();
})();
</script>
